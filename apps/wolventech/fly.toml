app = "wolventech-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    NEXT_PUBLIC_APP_URL = "https://wolventech.com"
    NEXT_PUBLIC_TURNSTILE_SITE_KEY = ""

[env]
  HOSTNAME = "0.0.0.0"
  NEXT_PUBLIC_APP_URL = "https://wolventech.com"
  PORT = "4200"

[http_service]
  internal_port = 4200
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
